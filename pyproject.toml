[project]
name = "tradingresearch"
version = "0.1.0"
description = "A stock research desk you build and run on your own machine (educational, not investment advice)."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "exchange-calendars>=4.13.3",
    "gigai-core==0.1.0",
    "httpx>=0.28.1",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "tokenizers>=0.23.3",
]

[project.scripts]
tr = "tradingresearch.cli:main"

[build-system]
requires = ["uv_build>=0.9.17,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
markers = [
    "live: calls a real API (needs network and, for Alpaca or OpenRouter, keys)",
    "oracle: checks indicators against TA-Lib (skipped when TA-Lib is not installed)",
]
addopts = "-m 'not live'"
