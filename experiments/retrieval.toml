# Week 6: do retrieved filing passages help an analysis? analyze-3 with no passages vs the same prompt with the top 5
# hybrid passages (BM25 + bge-small, reciprocal rank fusion) from one pinned index, on the same 20 ticker-days as
# weeks 4 and 5 (ADR-007). analyze-3 shows headlines, so run `tr news TICKER --session S` for every ticker and
# session first (the config refuses unfetched windows). The index digest is the one `tr retrieval build` printed for
# the 10 tickers below with --quarters 4 --dense; rebuild if `<data dir>/retrieval/` has no folder of that digest.
# The hybrid arm embeds its query with bge-small, so run it as `uv run --extra retrieval tr exp run <this file>`.
#
# Pre-registered before any paid run (ADR-009 "Pre-registration" has the full text):
# - Unit: the ticker-day, paired by item (hybrid minus none), clustered by ticker (10 clusters), 95% interval from
#   `tr exp` (gigai-core `compare`).
# - Primary: claims_valid. Hybrid is non-inferior if the lower bound of the 95% interval is above -0.05.
# - Secondary, reported and not deciding: all_claims_valid; parsed; the share of hybrid items in which any claim cites
#   a passage (items with a citation_accuracy score over all 20 hybrid items); citation_accuracy in the hybrid arm over
#   the items with graded claims (n stated, no interval if n < 10); input tokens, cost and latency per item.
# - Decision: the retrieval default stays `none` UNLESS hybrid is non-inferior on claims_valid AND passage-citing
#   claims occur in at least 25% of hybrid items AND their citation_accuracy is at least 0.90. Otherwise no change,
#   read as a measured negative (one model, one prompt, 20 ticker-days).
# Cap: gigai-core plans each arm's worst case (ceil(chars/4) input + 4,000 output tokens per call) before its first
# call: $0.85 for `none`, $0.90 for `hybrid` on these 20 items, so the cap is $1.00 per arm. Expected spend is about
# $0.34 for `none` (week 5's identical requests) and $0.40 for `hybrid` (RETRIEVAL-SPIKE §4.4 put it at $0.39).
name = "retrieval"
model = "anthropic/claude-sonnet-5.5"
max_usd_per_arm = 1.00
tickers = ["AAPL", "MSFT", "NVDA", "AMZN", "JPM", "XOM", "UNH", "HD", "KO", "CAT"]
sessions = ["2026-11-12", "2026-11-13"]
cluster = "ticker"
graders = ["parsed", "claims_valid", "all_claims_valid", "citation_accuracy"]

[[arms]]
name = "none"
prompt = "analyze-3"

[[arms]]
name = "hybrid"
prompt = "analyze-3"

[arms.retrieval]
mode = "hybrid"
k = 5
index = "sha256:71917448df40d8bedb619d7937e674591cb3124fcf38a3a12b66758136e761eb"
