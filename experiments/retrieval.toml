# Week 6: do retrieved filing passages help an analysis? analyze-3 with no passages vs the same prompt with the top 5
# hybrid passages (BM25 + bge-small, reciprocal rank fusion) from one pinned index, on the same 20 ticker-days as
# weeks 4 and 5 (ADR-007). analyze-3 shows headlines, so run `tr news TICKER --session S` for every ticker and
# session first (the config refuses unfetched windows). The index digest is the one `tr retrieval build` printed for
# the 10 tickers below with --quarters 4 --dense; rebuild if `<data dir>/retrieval/` has no folder of that digest.
#
# Pre-registered before any paid run (ADR-009):
# - Primary metric: claims_valid per ticker-day, paired by item (hybrid minus none), clustered by ticker
#   (10 clusters), 95% interval from `compare`. Same metric and reasons as ADR-007: all_claims_valid sits at a floor.
# - Guard metric: parsed must not drop in the hybrid arm.
# - Rule: passages earn a place in analyze's default if claims_valid does not drop (the whole 95% interval is not
#   below 0) and the guard holds. If the interval is wholly below 0, they stay out of the default.
# - Reported only, not deciding: citation_accuracy in the hybrid arm (the share of claims citing a passage whose
#   chunk was retrieved and whose value is written in it; it says whether the model used the passages at all; the
#   none arm has no passages, so an analysis there can only be ungradable or not_retrieved), all_claims_valid,
#   tokens, cost and latency per item. Expected cost: $0.33-0.36 for a 20-item analyze-3 arm, about $0.39 with 5
#   passages (RETRIEVAL-SPIKE §4.4), so $0.60 per arm is the cap.
name = "retrieval"
model = "anthropic/claude-sonnet-5.5"
max_usd_per_arm = 0.60
tickers = ["AAPL", "MSFT", "NVDA", "AMZN", "JPM", "XOM", "UNH", "HD", "KO", "CAT"]
sessions = ["2026-11-12", "2026-11-13"]
cluster = "ticker"
graders = ["parsed", "claims_valid", "all_claims_valid", "citation_accuracy"]

[[arms]]
name = "none"
prompt = "analyze-3"

[[arms]]
name = "hybrid"
prompt = "analyze-3"

[arms.retrieval]
mode = "hybrid"
k = 5
index = "sha256:71917448df40d8bedb619d7937e674591cb3124fcf38a3a12b66758136e761eb"
