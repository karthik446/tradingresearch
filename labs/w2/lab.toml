# Week 2 labs: the base, titles, pages, the unlock policy and the suite gate `tr lab` uses.
#
# base: the first `tr lab start` of this week makes the repo's files equal to the author's code at this tag (labs/
# and the runner's own files excepted) and commits it as `lab: week 2 base (week-2-start)`.
#
# [unlock] counts FAILED runs of `tr lab verify` on the current exercise. A run where the check could not start
# (syntax or import error, no tests collected) is not a failed run and does not count.
#   hints = [2, 5]   hint 1 unlocks after 2 failed runs, hint 2 after 5. An exercise with more hints than numbers
#                    unlocks the extra ones at the last number.
#   solution = 10    `tr lab solution` unlocks after 10 failed runs, or as soon as the check is green.
# A lab can override any of them, e.g.
#   [labs.w2l1.unlock]
#   hints = [3, 6]
# and keys it leaves out come from [unlock].
#
# [suite] deselect: tests/test_week2.py covers all of the chapter's §2-§3, so the repo suite is red until the week
# ends. The end-of-lab gate (`tr lab next` on a lab's last exercise) passes these node ids to pytest as --deselect:
# [suite] for every lab of the week, [labs.<lab>.suite] for one lab. Plain `python -m pytest -q` still runs them.
base = "week-2-start"

[unlock]
hints = [2, 5]
solution = 10

# §3's rubric file (evals/rubrics/p1_thesis_quality.md) is written by hand from the chapter, not in these labs.
[suite]
deselect = ["tests/test_week2.py::test_the_p1_rubric_has_every_section"]

[labs.w2l1]
title = "P2: is the evidence real"
page = "pages/w2l1.md"
goal = "Write P2, the check that a thesis's evidence is real, one rule at a time: it cites claims of its own analysis, facts not opinions, sources the table holds, and numbers that match them. Process checks like this judge a thesis before any trade closes."
section = [2]

# After w2l1, P2 is green; P3, P4 and the grader registrations come later in §2, the draft P1 judge in lab w2l4.
[labs.w2l1.suite]
deselect = ["tests/test_week2.py::test_p3_invalidation_testable",
            "tests/test_week2.py::test_p4_levels_coherent",
            "tests/test_week2.py::test_the_code_check_is_a_registered_binary_code_grader",
            "tests/test_week2.py::test_p1_judge_is_registered_as_an_unvalidated_model_grader"]

[labs.w2l2]
title = "P3: can the invalidation be reached"
page = "pages/w2l2.md"
goal = "Write P3, the check that a thesis's invalidation price can be reached before its stop, for a long, a short and a market_open entry. A thesis that cannot be shown wrong in time teaches nothing."
section = [2]

[labs.w2l2.suite]
deselect = ["tests/test_week2.py::test_p4_levels_coherent",
            "tests/test_week2.py::test_the_code_check_is_a_registered_binary_code_grader",
            "tests/test_week2.py::test_p1_judge_is_registered_as_an_unvalidated_model_grader"]

[labs.w2l3]
title = "P4: are stop and target placed against the levels"
page = "pages/w2l3.md"
goal = "Write P4, the check that a stop sits beyond the nearest level against the trade and the target stops near the next level with it, for a long, then a short, then at cents as the author amended it. It brings the chapter's six to 2/6."
section = [2]

# After w2l3, checks.py is complete; the graders and the draft P1 judge are lab w2l4.
[labs.w2l3.suite]
deselect = ["tests/test_week2.py::test_the_code_check_is_a_registered_binary_code_grader",
            "tests/test_week2.py::test_p1_judge_is_registered_as_an_unvalidated_model_grader"]

# After w2l4, the only test in tests/test_week2.py still red is the P1 rubric in [suite], so w2l4 has no list.
[labs.w2l4]
title = "Graders and the draft judge"
page = "pages/w2l4.md"
goal = "Wrap P2, P3 and P4 as graders that score a whole run, so experiment configs can name them by id, and register the P1 judge as a draft that refuses to score until week 3 has closed trades to validate it."
section = [2, 3]

# What labs/tools/prove.py checks after the last exercise: these files must equal the tag byte for byte (the runner
# ignores this table).
[end]
tag = "week-2-end"
files = ["src/tradingresearch/checks.py", "src/tradingresearch/evals.py"]
