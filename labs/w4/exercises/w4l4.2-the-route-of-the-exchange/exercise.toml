id = "w4l4.2"
title = "The route of the whole exchange"
effect = "Observe's replayed tool loop (turn1 served by Azure, turn2 by Google) goes from openrouter:Azure to openrouter:mixed(Azure+Google), a null provider from openrouter:None to openrouter:unknown, a new exchange whose call fails from the old openrouter:Azure to openrouter:unknown, and arms pinned to azure and google from all reporting openrouter:google to one route each, the unpinned original unknown."
goal = "Log every served route under the exchange's first user turn, start a new exchange on a request with no assistant or tool turn, keep a pinned copy's log apart, call a null provider unknown, and make route_for give the one route, mixed(a+b) sorted, or unknown."
what_tested = "The recorded loop over FAKEA and FAKEB with providers edited per call: Azure then Google is mixed, FAKEB keeps its own; one provider; mixes sorted, each once, over 2 to 4 turns, 4 providers over 6; a retried turn; null, missing or Unknown on either turn; nothing served; a new exchange replaces the old, a failed one leaves unknown; two pinned arms and the original apart; the route run_arms stores."
writes = [
  "Key the route log by the exchange's first user turn, so a follow-up request lands under its item prompt.",
  "When a request carries no assistant or tool turn, start that key's exchange afresh before the call goes out.",
  "Give the pinned copy its own route log and per-call list.",
  "Call a reply whose provider is null unknown, as one with no provider is.",
  "In route_for: unknown when nothing was served or any route is not clean; the route when all agree; else mixed with each provider once, sorted, without the client prefix.",
]
show_tests = ["test_a_tool_loop_served_by_two_providers_is_mixed_under_its_item_prompt", "test_a_new_exchange_that_fails_leaves_the_item_unknown"]
lab = "w4l4"
concepts = ["provider-route", "exchange"]
touches = ["src/tradingresearch/openrouter.py"]
check = "python -m pytest -q -x -p no:cacheprovider -m lab labs/w4/exercises/w4l4.2-the-route-of-the-exchange/test_w4l4_2.py"
observe = "python labs/w4/tools/observe.py route"
paid = false
fixtures = ["data/turn1.reply.json", "data/turn2.reply.json", "data/fakea.context.json", "data/models.json"]
origin = "rebuild of week-4-end openrouter.py (fixes 235fd20 and 2ed97a9): exchange_key, route_for, the per-exchange log; reference = the tag's own code"
red_expect = "route_for(FAKEA prompt), route_for(FAKEB prompt) = ('openrouter:Azure', 'openrouter:Azure')"
