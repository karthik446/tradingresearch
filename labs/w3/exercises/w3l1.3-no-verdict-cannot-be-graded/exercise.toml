id = "w3l1.3"
title = "Refuse a reply with no verdict: CannotGrade, not a fail"
effect = "Observe's w3l1.3 matches go from 0 of 10 replies to 10 of 10: a reply with no JSON, no verdict, or a verdict that is not exactly pass, fail or unknown now reads CannotGrade instead of a verdict the journal would refuse."
goal = "Refuse a reply the rubric does not define. A reply with no pass, fail or unknown verdict has nothing to store: calling it a fail counts a broken reply as a judgment, so p1_verdict raises CannotGrade and quotes the reply."
what_tested = "p1_verdict on the CannotGrade replies of labs/w3/data/replies.json: no JSON, no verdict key, maybe, Pass, null, a padded or hedged verdict, a list, an answer then a later object, a reply cut off mid-JSON; the refusal quotes the reply, readable replies still read, built replies (abstain, 1, 0, yes, no, true, false, \"\") follow the same rule, and a 17000-char reply still reads its last object."
writes = [
  "In p1_verdict, before the unknown rule: a verdict that is not exactly the string pass, fail or unknown raises gigai-core's CannotGrade.",
  "The CannotGrade message quotes the start of the reply, so whoever reads the error sees what the judge sent.",
]
show_tests = ["test_only_the_three_lower_case_verdicts_count", "test_the_refusal_quotes_the_reply"]
lab = "w3l1"
concepts = ["llm-judge", "cannotgrade", "verdict-format"]
touches = ["src/tradingresearch/evals.py"]
check = "python -m pytest -q -x -p no:cacheprovider -m lab labs/w3/exercises/w3l1.3-no-verdict-cannot-be-graded/test_w3l1_3.py"
observe = "python labs/w3/tools/observe.py verdicts"
paid = false
fixtures = ["data/replies.json"]
origin = "rebuild of week-3-end evals.py; reference = the tag's own p1_verdict"
red_expect = "no_json: 'I cannot decide this one.' holds no verdict"
