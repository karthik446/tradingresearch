id = "w3l3.2"
title = "Store the verdict and its ScoreRecord together"
effect = "Observe's store table: the recorded reply goes from NotImplementedError to Score 1.0 with verdict row pass and 1 p1 score, unknown to fail 0.0, and both injected write failures leave no row at all."
goal = "Finish p1_judge: read the reply with your p1_verdict, return the Score it earns, and store the verdict and the ScoreRecord it points at in one transaction, so a failure between the two writes leaves neither. A reply with no verdict stores nothing."
what_tested = "p1_judge on the closed FAKEA trade: the recorded pass returns Score 1.0 with a JudgeNote and stores a pass verdict linked to one ScoreRecord (same reason, the run file's model spans); fail and unknown are stored as fail 0.0; a reply with no verdict raises CannotGrade and stores nothing; a failure in either write leaves no row."
writes = [
