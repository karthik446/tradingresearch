id = "w3l4.1"
title = "What waits for the judge"
effect = "Observe's queue: on a journal of six theses, to_judge goes from all 6 to the 2 graded champion and challenger theses with no verdict, oldest first."
goal = "Write grade.to_judge, the list `tr grade --judge` pays to judge: champion and challenger theses with a Grade and no stored verdict, oldest first, so a capped run leaves the newest for the next and a judged thesis is never paid for twice."
what_tested = "to_judge on fresh journals: a challenger, a champion and a teacher thesis give the challenger then the champion; never-entered and closed, ungraded theses give nothing; a stored verdict, fail or pass, takes its thesis off; three theses graded in reverse come back all, in the order written."
writes = [
  "The query joins each thesis to its Grade, keeps the champion and challenger arms, and drops a thesis that has any row in judge_verdict.",
  "The rows come back in the order the theses were written.",
]
