# Week 1 labs: titles, pages and the unlock policy `tr lab` uses.
#
# [unlock] counts FAILED runs of `tr lab verify` on the current exercise. A run where the check could not start
# (syntax or import error, no tests collected) is not a failed run and does not count.
#   hints = [2, 5]   hint 1 unlocks after 2 failed runs, hint 2 after 5. An exercise with more hints than numbers
#                    unlocks the extra ones at the last number.
#   solution = 10    `tr lab solution` unlocks after 10 failed runs, or as soon as the check is green.
# A lab can override any of them, e.g.
#   [labs.w1l3.unlock]
#   hints = [3, 6]
# and keys it leaves out come from [unlock].
[unlock]
hints = [2, 5]
solution = 10

[labs.w1l1]
title = "claim checks"
page = "pages/w1l1.md"
goal = "Put back, one at a time, the four code checks that reject a bad claim in a model reply and say why, tested on the author's recorded replies. These checks are the floor every later eval in the track stands on."
section = [1, 2]

[labs.w1l2]
title = "open and axial coding"
page = "pages/w1l2.md"
goal = "Read 20 recorded analyses, write one note per analysis on its first failure, then group the notes into failure classes with counts. This taxonomy decides which evals the track builds next."
section = [3, 4]

[labs.w1l3]
title = "a code grader for the largest class suitable for a code grader"
page = "pages/w1l3.md"
goal = "Build a code grader for the largest failure class code can catch: inferences that name indicators their parent claims never cited. It is the first new eval of the track, built to a written spec."
section = [5]

[labs.w1l4]
title = "a variant prompt, a paired experiment, a decision"
page = "pages/w1l4.md"
goal = "Write a variant prompt with one rule per failure class, pre-register a paired experiment against the baseline, and compute the paired test, interval and ship decision by hand. This is how the track decides a change."
section = [6, 7]

# What labs/tools/prove.py checks after the last exercise: these files must equal the tag byte for byte (the runner
# ignores this table).
[end]
tag = "week-1-end"
files = ["src/tradingresearch/analyze.py", "src/tradingresearch/evals.py", "evals/labels.csv", "evals/taxonomy.md",
         "prompts/analyze-2.txt", "experiments/prompt-v2.toml"]
